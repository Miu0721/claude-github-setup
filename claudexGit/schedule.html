<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スケジュール管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 40px 16px;
    }

    h1 {
      text-align: center;
      color: #1a1a2e;
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .nav-link {
      display: block;
      text-align: center;
      color: #6c63ff;
      font-size: 0.85rem;
      margin-bottom: 24px;
      text-decoration: none;
    }

    .nav-link:hover { text-decoration: underline; }

    .layout {
      display: flex;
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    .calendar-card {
      flex: 1;
      min-width: 280px;
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      align-self: start;
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .cal-nav {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: #6c63ff;
      padding: 4px 10px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .cal-nav:hover { background: #f0eeff; }

    .cal-title { font-size: 1.1rem; font-weight: 700; color: #1a1a2e; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .cal-dow {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: #888;
      padding: 4px 0;
    }

    .cal-dow:first-child { color: #e05c5c; }
    .cal-dow:last-child  { color: #5c8be0; }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.82rem;
      color: #333;
      position: relative;
      transition: background 0.15s;
    }

    .cal-day:hover { background: #f0eeff; }
    .cal-day.other-month { color: #ccc; }
    .cal-day.today { background: #f0eeff; font-weight: 700; color: #6c63ff; }
    .cal-day.selected { background: #6c63ff !important; color: white !important; }

    .dot {
      width: 5px;
      height: 5px;
      background: #6c63ff;
      border-radius: 50%;
      position: absolute;
      bottom: 3px;
    }

    .cal-day.selected .dot { background: white; }

    .right-panel {
      flex: 1;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-card, .events-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card-title { font-size: 1rem; font-weight: 700; color: #1a1a2e; margin-bottom: 14px; }

    .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }

    .form-row label { font-size: 0.78rem; color: #888; font-weight: 600; }

    .form-row input,
    .form-row textarea {
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .form-row input:focus,
    .form-row textarea:focus { border-color: #6c63ff; }

    .form-row textarea { resize: none; height: 56px; }

    .color-row { display: flex; gap: 8px; margin-bottom: 12px; }

    .color-chip {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: border-color 0.15s;
    }

    .color-chip.selected { border-color: #333; }

    .add-btn {
      width: 100%;
      padding: 11px;
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add-btn:hover { background: #574fd6; }

    .event-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .event-item:last-child { border-bottom: none; }

    .event-bar {
      width: 4px;
      min-height: 36px;
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .event-body { flex: 1; }
    .event-title { font-size: 0.9rem; font-weight: 600; color: #1a1a2e; margin-bottom: 2px; }
    .event-time  { font-size: 0.78rem; color: #aaa; }
    .event-note  { font-size: 0.8rem; color: #888; margin-top: 2px; }

    .event-del {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.2s;
    }

    .event-del:hover { color: #ff5c5c; }

    .empty-msg { text-align: center; color: #ccc; padding: 24px 0; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>スケジュール管理</h1>
  <a class="nav-link" href="todo.html">← 📝 TODOリストへ</a>

  <div class="layout">
    <div class="calendar-card">
      <div class="cal-header">
        <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
        <span class="cal-title" id="calTitle"></span>
        <button class="cal-nav" onclick="changeMonth(1)">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="right-panel">
      <div class="form-card">
        <div class="card-title">予定を追加</div>
        <div class="form-row">
          <label>タイトル</label>
          <input type="text" id="evTitle" placeholder="例：会議、誕生日" />
        </div>
        <div class="form-row">
          <label>日付</label>
          <input type="date" id="evDate" />
        </div>
        <div class="form-row">
          <label>時間（任意）</label>
          <input type="time" id="evTime" />
        </div>
        <div class="form-row">
          <label>メモ（任意）</label>
          <textarea id="evNote" placeholder="詳細を入力..."></textarea>
        </div>
        <div class="form-row">
          <label>カラー</label>
          <div class="color-row" id="colorRow"></div>
        </div>
        <button class="add-btn" onclick="addEvent()">追加する</button>
      </div>

      <div class="events-card">
        <div class="card-title" id="listTitle">選択した日の予定</div>
        <div id="eventList"></div>
      </div>
    </div>
  </div>

  <script>
    const COLORS = ['#6c63ff','#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#f97316'];
    let selectedColor = COLORS[0];
    let events = JSON.parse(localStorage.getItem('scheduleEvents') || '[]');
    const todayObj   = new Date();
    let viewYear     = todayObj.getFullYear();
    let viewMonth    = todayObj.getMonth();
    let selectedDate = toDateStr(todayObj);

    function toDateStr(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function save() { localStorage.setItem('scheduleEvents', JSON.stringify(events)); }

    function buildColorRow() {
      document.getElementById('colorRow').innerHTML = COLORS.map(c =>
        `<div class="color-chip ${c===selectedColor?'selected':''}"
              style="background:${c}"
              onclick="selectColor('${c}')"></div>`
      ).join('');
    }

    function selectColor(c) { selectedColor = c; buildColorRow(); }

    function buildCalendar() {
      document.getElementById('calTitle').textContent = `${viewYear}年 ${viewMonth+1}月`;
      const todayStr = toDateStr(todayObj);
      const first    = new Date(viewYear, viewMonth, 1).getDay();
      const days     = new Date(viewYear, viewMonth+1, 0).getDate();
      const prevDays = new Date(viewYear, viewMonth, 0).getDate();

      let html = ['日','月','火','水','木','金','土'].map(d => `<div class="cal-dow">${d}</div>`).join('');

      for (let i = 0; i < first; i++) {
        const d    = prevDays - first + 1 + i;
        const dStr = `${viewYear}-${String(viewMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        html += `<div class="cal-day other-month" onclick="selectDate('${dStr}')">${d}</div>`;
      }

      for (let d = 1; d <= days; d++) {
        const dStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const cls  = [
          dStr === todayStr     ? 'today'    : '',
          dStr === selectedDate ? 'selected' : ''
        ].filter(Boolean).join(' ');
        const hasDot = events.some(e => e.date === dStr);
        html += `<div class="cal-day ${cls}" onclick="selectDate('${dStr}')">${d}${hasDot?'<span class="dot"></span>':''}</div>`;
      }

      document.getElementById('calGrid').innerHTML = html;
    }

    function changeMonth(dir) {
      viewMonth += dir;
      if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
      if (viewMonth > 11) { viewMonth = 0;  viewYear++; }
      buildCalendar();
    }

    function selectDate(dStr) {
      selectedDate = dStr;
      document.getElementById('evDate').value = dStr;
      buildCalendar();
      renderEvents();
    }

    function addEvent() {
      const title = document.getElementById('evTitle').value.trim();
      const date  = document.getElementById('evDate').value;
      if (!title || !date) { alert('タイトルと日付は必須です'); return; }

      events.push({
        id: Date.now(), title, date,
        time:  document.getElementById('evTime').value,
        note:  document.getElementById('evNote').value.trim(),
        color: selectedColor
      });
      events.sort((a,b) => (a.date+a.time) < (b.date+b.time) ? -1 : 1);
      save();

      document.getElementById('evTitle').value = '';
      document.getElementById('evTime').value  = '';
      document.getElementById('evNote').value  = '';

      buildCalendar();
      renderEvents();
    }

    function deleteEvent(id) {
      events = events.filter(e => e.id !== id);
      save();
      buildCalendar();
      renderEvents();
    }

    function renderEvents() {
      const [,m,d] = selectedDate.split('-');
      document.getElementById('listTitle').textContent = `${parseInt(m)}月${parseInt(d)}日の予定`;
      const dayEvents = events.filter(e => e.date === selectedDate);

      document.getElementById('eventList').innerHTML = dayEvents.length === 0
        ? '<div class="empty-msg">予定はありません</div>'
        : dayEvents.map(e => `
            <div class="event-item">
              <div class="event-bar" style="background:${e.color}"></div>
              <div class="event-body">
                <div class="event-title">${esc(e.title)}</div>
                <div class="event-time">${e.time || '終日'}</div>
                ${e.note ? `<div class="event-note">${esc(e.note)}</div>` : ''}
              </div>
              <button class="event-del" onclick="deleteEvent(${e.id})">✕</button>
            </div>`
          ).join('');
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('evDate').value = selectedDate;
    buildColorRow();
    buildCalendar();
    renderEvents();
  </script>
</body>
</html>
